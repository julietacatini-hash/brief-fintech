name: Actualizar noticias

on:
  schedule:
    # Cada 4 horas
    - cron: "15 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r recolector/requirements.txt

      - name: Recolectar noticias
        run: python recolector/recolectar.py

      - name: Publicar
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias $(TZ=America/Argentina/Buenos_Aires date '+%F %H:%M')"
            git push
          fi
